services:
  mariadb:
    container_name: mariadb
    image: mariadb
    build: ./requirements/mariadb/.
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
    volumes:
      - mariadb:/var/lib/mysql/
    networks:
      - inception_net

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/.
    restart: always
    env_file:
      - .env
    secrets:
      - credentials
      - db_password
    volumes:
      - wordpress:/var/www/html/
    depends_on:
      - mariadb
    networks:
      - inception_net
    image: wordpress

  nginx:
    container_name: nginx
    build: ./requirements/nginx/.
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html/
    ports:
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - inception_net
    image: nginx

networks:
  inception_net:
    name: inception_net

volumes:
  wordpress:
    driver: local
    driver_opts:
      o: bind
      device: /home/${USER_NAME}/data/wordpress/
      type: none

  mariadb:
    driver: local
    driver_opts: #conncet one location to other
      o: bind
      device: /home/${USER_NAME}/data/db/
      type: none

secrets:
  credentials:
    file: ../secrets/credentials.txt

  db_password:
    file: ../secrets/db_password.txt

  # db_root_password:
  #   file: ../secrets/db_root_password.txt